# Los chequeos viven en el repositorio `.github` de la organización, así que
# acá sólo se los llama. Cambiarlos es cambiarlos en un solo lugar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # Sólo lectura. Estos chequeos clonan, instalan dependencias y comprueban:
    # no comentan, no etiquetan, no publican.
    #
    # El workflow llamado declara lo mismo en su trabajo, que es donde el
    # permiso se aplica; esto lo escribe también acá porque el análisis
    # estático de este repositorio no puede ver el otro archivo, y ahí un
    # trabajo sin `permissions` se lee como permisos por omisión.
    permissions:
      contents: read
    uses: Vasak-OS/.github/.github/workflows/app.yml@main
    with:
      # Las pruebas de Rust se piden crate por crate y no con un `cargo test`
      # pelado. En la raíz del workspace, ese `cargo test` sin selectores se
      # lleva por delante **todos** los miembros, y uno de ellos es
      # `prompt/src-tauri`, que es un diálogo de Tauri: webkit2gtk y medio
      # escritorio por un runner Ubuntu, que es exactamente la tanda de apt de
      # varios minutos que el flujo compartido evita a propósito. Por eso el
      # paso pide los crates explícitos en la forma que espera `cargo test`.
      #
      # Los tres que van son los que no dependen de Tauri y compilan en un
      # runner pelado, y son los que de verdad importan: este demonio es el que
      # le entrega la contraseña del inicio de sesión a la sesión, y sus 33
      # pruebas no corrían en ningún PR porque el paso se saltaba entero al no
      # pasarse esta entrada. En `vasak-permissions` ya se hacía, y era el
      # único lugar de la organización donde las pruebas de Rust se ejecutaban.
      #
      # `vasak-keyring-prompt` queda afuera a propósito, no por olvido: sus
      # pruebas necesitan el mismo escritorio que el diálogo.
      pruebas_rust: -p vasak-keyring -p vasak-keyring-derivacion -p pam-vasak-keyring
    # Sólo el token de SonarQube Cloud, y por nombre: `secrets: inherit`
    # le daría también el de crates.io y el de npm a un trabajo que
    # instala dependencias de terceros.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
