[workspace]
members = ["pam_vasak_keyring"]
resolver = "2"

[package]
name = "vasak-keyring"
version = "0.2.1"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
zeroize = "1"
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
num-bigint = "0.4"
sha2 = "0.10"
hkdf = "0.12"
# AES-128-CBC/PKCS7 is what the Secret Service session spec mandates for the
# transport. cbc 0.1 is the generation built on cipher 0.4, which is what
# aes 0.8 speaks; cbc 0.2 pulls in cipher 0.5 and the types stop matching.
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
