[workspace]
members = ["derivacion", "pam_vasak_keyring", "prompt/src-tauri"]
resolver = "2"

[package]
name = "vasak-keyring"
version = "0.7.5"
edition = "2021"

[dependencies]
# The XDG base directories, so the rule that a relative or empty variable is
# ignored lives in one place and not in a copy per program. See `keyring_path`.
dirs = "6"
aes-gcm = "0.10"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
zeroize = "1"
libc = "0.2"
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
num-bigint = "0.4"
sha2 = "0.10"
hkdf = "0.12"
# AES-128-CBC/PKCS7 is what the Secret Service session spec mandates for the
# transport. cbc 0.1 is the generation built on cipher 0.4, which is what
# aes 0.8 speaks; cbc 0.2 pulls in cipher 0.5 and the types stop matching.
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }

[dev-dependencies]
# Para await en un `MessageStream` de zbus, que implementa `Stream` del mundo de
# `futures` y no trae el `next` por su cuenta. Sólo para las pruebas: lo que las
# necesita es poder mirar la señal de `Locked` que llega por el bus, y sin esto
# el aviso del bloqueo no se podría comprobar.
futures-util = "0.3"
# La construcción de una conexión punto a punto es de zbus con la característica
# `p2p`, que el demonio no usa y no tiene activa. Va acá y no en `[dependencies]`
# a propósito: es lo que permite mirar la señal y el nombre del error como
# viajan por el bus, con dos puntas de un `UnixStream` y sin `dbus-daemon`, y no
# pesa en el binario que se instala.
zbus = { version = "5", features = ["tokio", "p2p"] }
